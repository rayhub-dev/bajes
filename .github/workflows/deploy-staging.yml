# ─── Deploy Staging: VPS (develop branch) ─────────────────────────────────────
# Deploys API to VPS via SSH + rsync when develop branch is pushed
# Frontend auto-deploys to Vercel via Vercel GitHub integration
name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.3"
  DEPLOY_PATH: /home/deploy/bajes-staging
  PM2_APP_NAME: bajes-api-staging

jobs:
  # ─── Build API ─────────────────────────────────────────────────────────────────
  build:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bajes/api db:generate

      - name: Build API and workspace dependencies
        run: pnpm --filter @bajes/api... build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package

          # Copy compiled API
          cp -r apps/api/dist deploy-package/dist
          cp -r apps/api/prisma deploy-package/prisma
          cp ecosystem.config.cjs deploy-package/ecosystem.config.cjs

          # Copy compiled workspace packages (strip devDependencies to avoid workspace:* resolution errors)
          node -e "
            const fs = require('fs');
            const path = require('path');

            // --- 1. Rewrite API package.json ---
            const pkg = require('./apps/api/package.json');
            if (pkg.dependencies) {
              for (const [name, version] of Object.entries(pkg.dependencies)) {
                if (String(version).startsWith('workspace:')) {
                  pkg.dependencies[name] = 'file:./workspace-packages/' + name;
                }
              }
            }
            // Move prisma from devDependencies to dependencies (needed for generate + migrate on VPS)
            if (pkg.devDependencies && pkg.devDependencies.prisma) {
              pkg.dependencies = pkg.dependencies || {};
              pkg.dependencies.prisma = pkg.devDependencies.prisma;
            }
            delete pkg.devDependencies;
            fs.writeFileSync('./deploy-package/package.json', JSON.stringify(pkg, null, 2));

            // --- 2. Copy workspace packages with cleaned package.json ---
            const workspacePackages = ['schemas', 'types'];
            for (const pkgName of workspacePackages) {
              const srcDir = path.join('packages', pkgName);
              const destDir = path.join('deploy-package', 'workspace-packages', '@bajes', pkgName);
              fs.mkdirSync(destDir, { recursive: true });

              // Copy dist/
              fs.cpSync(path.join(srcDir, 'dist'), path.join(destDir, 'dist'), { recursive: true });

              // Write cleaned package.json (only keep name, version, type, main, types, exports, dependencies)
              const wsPkg = require('./' + path.join(srcDir, 'package.json'));
              const cleanPkg = {
                name: wsPkg.name,
                version: wsPkg.version,
                type: wsPkg.type,
                main: wsPkg.main,
                types: wsPkg.types,
                exports: wsPkg.exports,
                dependencies: wsPkg.dependencies || {},
              };
              fs.writeFileSync(path.join(destDir, 'package.json'), JSON.stringify(cleanPkg, null, 2));
            }

            console.log('✅ Deploy package prepared');
            console.log('   API deps:', Object.keys(pkg.dependencies).join(', '));
            for (const pkgName of workspacePackages) {
              const wsPkg = require('./packages/' + pkgName + '/package.json');
              console.log('   @bajes/' + pkgName + ' deps:', Object.keys(wsPkg.dependencies || {}).join(', ') || '(none)');
            }
          "

          # Copy generated Prisma client (so VPS uses matching version)
          cp -r apps/api/node_modules/.prisma deploy-package/.prisma-generated 2>/dev/null || true

          # Generate package-lock.json for deterministic installs on VPS
          cd deploy-package
          npm install --package-lock-only --ignore-scripts 2>/dev/null || true
          cd ..

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: deploy-package-staging
          path: deploy-package/
          retention-days: 1

  # ─── Deploy to VPS ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Validate deployment secrets
        run: |
          missing=""
          if [ -z "${{ secrets.VPS_HOST }}" ]; then missing="$missing VPS_HOST"; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then missing="$missing VPS_USER"; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then missing="$missing VPS_SSH_KEY"; fi
          if [ -n "$missing" ]; then
            echo "❌ Missing required secrets:$missing"
            echo "Go to Settings > Secrets > Actions to configure them."
            exit 1
          fi
          echo "✅ All deployment secrets are configured"

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deploy-package-staging
          path: deploy-package/

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Rsync files to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='node_modules' --exclude='.env'
          path: deploy-package/
          remote_path: ${{ env.DEPLOY_PATH }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT || 22 }}

      - name: Post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "📦 Installing production dependencies..."
            npm install --omit=dev 2>&1
            echo "✅ npm install complete"

            # Verify critical packages exist
            if [ ! -d "node_modules/fastify" ]; then
              echo "❌ FATAL: fastify not found in node_modules after install"
              ls -la node_modules/ | head -20
              exit 1
            fi
            echo "✅ Critical packages verified"

            # Use LOCAL prisma CLI (not npx which may resolve to global Prisma 7)
            PRISMA="./node_modules/.bin/prisma"
            if [ ! -f "$PRISMA" ]; then
              echo "❌ FATAL: Local prisma CLI not found at $PRISMA"
              exit 1
            fi
            echo "✅ Using local Prisma: $($PRISMA --version)"

            # Generate Prisma client on server
            $PRISMA generate --schema=prisma/schema.prisma

            # Run database migrations
            $PRISMA migrate deploy --schema=prisma/schema.prisma

            # Ensure logs directory exists
            mkdir -p logs

            # Verify .env file exists (Node --env-file silently ignores missing files)
            if [ ! -f ".env" ]; then
              echo "⚠️  WARNING: .env file not found at ${{ env.DEPLOY_PATH }}/.env"
              echo "   The app will start without environment variables and likely crash."
              echo "   Create .env with DATABASE_URL, SUPABASE_URL, etc."
            fi

            # Restart PM2 process (PM2_APP_NAME ensures unique name per environment)
            PM2_APP_NAME=${{ env.PM2_APP_NAME }} pm2 startOrRestart ecosystem.config.cjs --env staging --update-env
            pm2 save

            # Wait for app to stabilize, then verify it's actually running
            echo "⏳ Waiting 5s for app to start..."
            sleep 5

            # Check PM2 status
            pm2 status
            PM2_STATUS=$(pm2 jq ${{ env.PM2_APP_NAME }} 2>/dev/null || echo "[]")
            echo "PM2 process info: $PM2_STATUS"

            # Check if processes are in 'online' state (not 'errored' or 'stopped')
            ONLINE_COUNT=$(pm2 list 2>/dev/null | grep -c "online" || echo "0")
            if [ "$ONLINE_COUNT" -eq "0" ]; then
              echo "❌ No PM2 processes are online! Dumping error logs:"
              pm2 logs ${{ env.PM2_APP_NAME }} --nostream --lines 30 2>&1 || true
              exit 1
            fi

            # Health check via localhost
            echo "🏥 Running health check..."
            HEALTH=$(curl -sf --max-time 10 http://127.0.0.1:4000/health 2>&1) || {
              echo "❌ Health check failed! API not responding on port 4000"
              echo "PM2 logs:"
              pm2 logs ${{ env.PM2_APP_NAME }} --nostream --lines 50 2>&1 || true
              exit 1
            }
            echo "✅ Health check passed: $HEALTH"
            echo "✅ Staging deployment complete"

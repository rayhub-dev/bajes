<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bajes UI Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bajesBg: "#FAF8F5",
              bajesYellow: "#E5FF00",
              bajesPink: "#FF80DF",
              bajesRed: "#FF3333",
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
              display: ['"Space Grotesk"', "sans-serif"],
            },
            boxShadow: {
              brutal: "4px 4px 0px 0px rgba(0,0,0,1)",
              brutalHover: "2px 2px 0px 0px rgba(0,0,0,1)",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-bajesBg min-h-screen flex items-center justify-center p-6">
    <!-- Card Container -->
    <div
      class="bg-white border-4 border-black rounded-2xl shadow-brutal p-6 max-w-sm w-full transition-all"
    >
      <!-- Header Section -->
      <div class="flex justify-between items-center mb-6">
        <div>
          <p
            class="text-sm font-semibold text-gray-500 uppercase tracking-wider"
          >
            Sisa Bajes Lo
          </p>
          <h1 class="text-4xl font-display font-bold text-black mt-1">
            Rp 450.000
          </h1>
        </div>
        <div
          class="bg-bajesPink border-2 border-black rounded-full px-3 py-1 shadow-[2px_2px_0px_rgba(0,0,0,1)]"
        >
          <span class="text-xs font-bold text-black uppercase">Aman 😎</span>
        </div>
      </div>

      <!-- Warning Box -->
      <div
        class="bg-bajesYellow border-2 border-black rounded-xl p-4 mb-6 shadow-brutal"
      >
        <p class="text-sm font-semibold font-sans text-black">
          "Ngerem woy! Bajes ngopi lo udah mau limit nih!"
        </p>
      </div>

      <!-- Button -->
      <button
        class="w-full bg-bajesYellow border-4 border-black rounded-xl py-3 font-display font-bold text-lg text-black shadow-brutal hover:shadow-brutalHover hover:translate-x-[2px] hover:translate-y-[2px] transition-all active:shadow-none active:translate-x-[4px] active:translate-y-[4px]"
      >
        + TAMBAH PENGELUARAN
      </button>
    </div>
  </body>
</html>

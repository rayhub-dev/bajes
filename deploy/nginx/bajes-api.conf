# ─── Nginx Reverse Proxy: Bajes API ────────────────────────────────────────────
# Two server blocks:
#   1. api.bajes.my.id         → production (port 4001)
#   2. staging-api.bajes.my.id → staging    (port 4000)
#
# Setup steps:
#   1. sudo cp bajes-api.conf /etc/nginx/sites-available/bajes-api
#   2. sudo ln -s /etc/nginx/sites-available/bajes-api /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#
# Both use Cloudflare Flexible SSL (Cloudflare handles HTTPS, origin uses HTTP).

# ─── PRODUCTION: api.bajes.my.id → port 4001 ─────────────────────────────────
server {
    listen 80;
    server_name api.bajes.my.id;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:4001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ─── STAGING: staging-api.bajes.my.id → port 4000 ────────────────────────────
server {
    listen 80;
    server_name staging-api.bajes.my.id;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

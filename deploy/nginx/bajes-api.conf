# ─── Nginx Reverse Proxy: Bajes API ────────────────────────────────────────────
# Place this file in /etc/nginx/sites-available/ and symlink to sites-enabled/
#
# Setup steps:
#   1. sudo cp bajes-api.conf /etc/nginx/sites-available/bajes-api
#   2. sudo ln -s /etc/nginx/sites-available/bajes-api /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#
# For SSL with Cloudflare (Origin Certificate):
#   - Generate Origin Certificate in Cloudflare dashboard
#   - Place cert at /etc/ssl/bajes/origin.pem
#   - Place key at /etc/ssl/bajes/origin-key.pem
#   - Uncomment the SSL server block below

# ─── HTTP (IP-based, initial setup) ──────────────────────────────────────────
server {
    listen 80;
    server_name api.bajes.my.id;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 256;

    # Rate limiting zone (define in nginx.conf http block)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Rate limiting
        # limit_req zone=api burst=50 nodelay;
    }

    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ─── HTTPS (uncomment when domain + Cloudflare SSL is ready) ─────────────────
server {
    listen 443 ssl http2;
    server_name api.bajes.my.id;

    # Cloudflare Origin Certificate
    ssl_certificate /etc/ssl/bajes/origin.pem;
    ssl_certificate_key /etc/ssl/bajes/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS (handled by Cloudflare, but also set here)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.bajes.my.id;
    return 301 https://$server_name$request_uri;
}
